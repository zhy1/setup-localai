name: release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            os: ubuntu-latest
            platform: linux
            arch: amd64
          - name: linux-arm64
            os: ubuntu-latest
            platform: linux
            arch: arm64
          - name: darwin-amd64
            os: macos-latest
            platform: darwin
            arch: amd64
          - name: darwin-arm64
            os: macos-latest
            platform: darwin
            arch: arm64
          - name: windows-amd64
            os: windows-latest
            platform: windows
            arch: amd64
          - name: windows-arm64
            os: windows-latest
            platform: windows
            arch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'

      - name: Build artifact
        env:
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
        run: ./build.sh

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: outputs/*

  publish:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Gather artifact paths
        id: gather
        run: |
          set -euo pipefail
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' \) | sort > filelist.txt
          echo "filelist<<EOF" >> "$GITHUB_OUTPUT"
          cat filelist.txt >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.gather.outputs.filelist }}
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: Release built binaries for ${{ github.ref_name }}
          draft: false
