name: release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            os: ubuntu-latest
            platform: linux
            arch: amd64
          - name: linux-arm64
            os: ubuntu-latest
            platform: linux
            arch: arm64
          - name: darwin-amd64
            os: macos-latest
            platform: darwin
            arch: amd64
          - name: darwin-arm64
            os: macos-latest
            platform: darwin
            arch: arm64
          - name: windows-amd64
            os: windows-latest
            platform: windows
            arch: amd64
          - name: windows-arm64
            os: windows-latest
            platform: windows
            arch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'

      - name: Build binary
        env:
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
        run: ./build.sh

      - name: Prepare artifact name
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          artifacts=(outputs/*)
          if [ ${#artifacts[@]} -eq 0 ]; then
            echo "No artifacts produced" >&2
            exit 1
          fi
          artifact="${artifacts[0]}"
          echo "artifact_path=$artifact" >> "$GITHUB_ENV"
          echo "artifact_name=$(basename "$artifact")" >> "$GITHUB_ENV"

      - name: Upload release asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.artifact_path }}
